services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      REPORTES_FIXTURE: populated
      MI_INFORMACION_FIXTURE: populated
      ASISTENCIAS_FIXTURE: populated
      MATRICULA_INFORMACION_FIXTURE: populated
      PROGRAMACION_FIXTURE: populated
      PLAN_ESTUDIOS_FIXTURE: populated
    init: true
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - '127.0.0.1:${SUM_PORT:-5180}:8080'
    depends_on:
      backend:
        condition: service_healthy
