map_hash_bucket_size 256;

map $http_origin $simulator_allowed_origin {
  default "";
  "http://web" "http://127.0.0.1:${SIMULATOR_HTTP_PORT}";
  "http://127.0.0.1:${SIMULATOR_HTTP_PORT}" "http://127.0.0.1:${SIMULATOR_HTTP_PORT}";
  "${SIMULATOR_TAILNET_ORIGIN}" "http://127.0.0.1:${SIMULATOR_HTTP_PORT}";
}

map $http_host $simulator_upstream_host {
  default "127.0.0.1:${SIMULATOR_HTTP_PORT}";
  "${SIMULATOR_TAILNET_AUTHORITY}" "${SIMULATOR_TAILNET_HOST}";
}

map $http_host $simulator_forwarded_proto {
  default http;
  "${SIMULATOR_TAILNET_AUTHORITY}" https;
}

upstream simulator_api {
  least_conn;
  server api-a:3000 max_fails=2 fail_timeout=3s;
  server api-b:3000 max_fails=2 fail_timeout=3s;
  keepalive 32;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://simulator_api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $simulator_upstream_host;
    proxy_set_header X-Forwarded-Proto $simulator_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Origin $simulator_allowed_origin;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_next_upstream off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
