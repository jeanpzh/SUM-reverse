name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - run: pnpm --dir client install --frozen-lockfile
      - run: pnpm --dir client build
      - run: pnpm --dir client lint
      - run: pnpm --dir client test:data

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            client/pnpm-lock.yaml
      # Some backend integration specs drive the client with Playwright.
      - run: pnpm --dir client install --frozen-lockfile
      - run: pnpm --dir client exec playwright install --with-deps chromium
      - run: pnpm --dir backend install --frozen-lockfile
      - run: pnpm --dir backend build
      - run: pnpm --dir backend lint
      - run: pnpm --dir backend test
